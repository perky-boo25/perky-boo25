name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats, streak, and top-langs SVG cards
        run: python .github/scripts/generate_stats.py --output-dir assets
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push updated SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/streak.svg assets/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub stats SVG cards"
            git push
          fi
