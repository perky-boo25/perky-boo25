<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="langsTitle langsDesc">
  <title id="langsTitle">Most Used Languages</title>
  <desc id="langsDesc">HTML: 60.11%, Dart: 15.46%, CSS: 11.20%, JavaScript: 10.89%, C++: 1.33%, CMake: 1.01%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a78bfa;
    }
    .lang-name {
      font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #e5e7eb;
    }
    .lang-pct {
      font: 400 12.5px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #9ca3af;
    }
  </style>

  <rect x="0.5" y="0.5" rx="6" width="494" height="194" fill="#0f1020" stroke="#2e2459" stroke-opacity="0"/>

  <text x="25" y="35" class="header">Most Used Languages</text>

  <!-- Multi-segment Language Bar -->
  <g transform="translate(25, 58)">
    <mask id="langBarMask">
      <rect x="0" y="0" width="445" height="10" rx="5" fill="white"/>
    </mask>
    <rect x="0" y="0" width="445" height="10" rx="5" fill="#1f2037"/>
    <rect mask="url(#langBarMask)" x="0.00" y="0" width="267.49" height="10" fill="#e34c26"/>
    <rect mask="url(#langBarMask)" x="267.49" y="0" width="68.80" height="10" fill="#00B4AB"/>
    <rect mask="url(#langBarMask)" x="336.29" y="0" width="49.84" height="10" fill="#663399"/>
    <rect mask="url(#langBarMask)" x="386.13" y="0" width="48.46" height="10" fill="#f1e05a"/>
    <rect mask="url(#langBarMask)" x="434.59" y="0" width="5.92" height="10" fill="#f34b7d"/>
    <rect mask="url(#langBarMask)" x="440.51" y="0" width="4.49" height="10" fill="#DA3434"/>
  </g>

  <!-- Language Legend -->
  <g transform="translate(25, 92)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="6" fill="#e34c26"/>
      <text x="20" y="10" class="lang-name">HTML <tspan class="lang-pct">60.11%</tspan></text>
    </g>
    <g transform="translate(0, 28)">
      <circle cx="6" cy="6" r="6" fill="#00B4AB"/>
      <text x="20" y="10" class="lang-name">Dart <tspan class="lang-pct">15.46%</tspan></text>
    </g>
    <g transform="translate(0, 56)">
      <circle cx="6" cy="6" r="6" fill="#663399"/>
      <text x="20" y="10" class="lang-name">CSS <tspan class="lang-pct">11.20%</tspan></text>
    </g>
    <g transform="translate(220, 0)">
      <circle cx="6" cy="6" r="6" fill="#f1e05a"/>
      <text x="20" y="10" class="lang-name">JavaScript <tspan class="lang-pct">10.89%</tspan></text>
    </g>
    <g transform="translate(220, 28)">
      <circle cx="6" cy="6" r="6" fill="#f34b7d"/>
      <text x="20" y="10" class="lang-name">C++ <tspan class="lang-pct">1.33%</tspan></text>
    </g>
    <g transform="translate(220, 56)">
      <circle cx="6" cy="6" r="6" fill="#DA3434"/>
      <text x="20" y="10" class="lang-name">CMake <tspan class="lang-pct">1.01%</tspan></text>
    </g>
  </g>
</svg>
